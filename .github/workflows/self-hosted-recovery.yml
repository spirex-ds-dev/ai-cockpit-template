name: self-hosted recovery validation

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Immutable 40-character lowercase Git commit SHA to diagnose.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: self-hosted-recovery-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  recovery-quality:
    # This exact label set isolates the personal runner from future generic
    # self-hosted jobs. It is a diagnostic route, never hosted release evidence.
    runs-on: [self-hosted, macOS, X64, ai-cockpit-recovery]
    timeout-minutes: 45

    steps:
      - name: Validate requested source commit
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a 40-character lowercase Git SHA" >&2
            exit 1
          fi
          printf 'SOURCE_COMMIT=%s\n' "$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Verify checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$SOURCE_COMMIT"
          git cat-file -e "$SOURCE_COMMIT^{commit}"

      - name: Run bounded diagnostic quality
        id: quality
        shell: bash
        run: make quality

      - name: Publish diagnostic result
        if: always()
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_OUTCOME" = success ]]; then
            echo 'RECOVERY_RESULT=green' >> "$GITHUB_ENV"
            result='green'
          else
            echo 'RECOVERY_RESULT=red' >> "$GITHUB_ENV"
            result='red'
          fi
          {
            echo '## Self-hosted recovery diagnostic'
            echo
            echo "- Requested source commit: \`$SOURCE_COMMIT\`"
            echo "- Result: **$result**"
            echo '- This result is diagnostic only and cannot satisfy compatibility, merge, or release gates.'
            echo '- After GitHub-hosted Actions recovers, rerun the normal hosted smoke and compatibility workflows before merge or release.'
          } >> "$GITHUB_STEP_SUMMARY"
