name: smoke

run-name: smoke ${{ inputs.purpose || github.event_name }}${{ inputs.release_run_id && format(' for release {0}', inputs.release_run_id) || '' }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      purpose:
        description: Select the governed reason for the manual smoke run.
        required: true
        default: release_preparation
        type: choice
        options:
          - hosted_measurement
          - release_preparation
          - release_verification
      release_run_id:
        description: "Parent release workflow run ID for a strict release verification smoke run"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: smoke-${{ github.ref }}-${{ inputs.purpose || github.event_name }}-${{ inputs.release_run_id || 'shared' }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Delegated secret scanning (release-blocking)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          GOBIN="$RUNNER_TEMP/gitleaks-bin" go install github.com/zricethezav/gitleaks/v8@9c72c5f9f05200fdc06e3f1b16e9aaa89fbe9f75
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" detect --source="$GITHUB_WORKSPACE" --log-opts="--all" --no-banner

  project-test-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install development quality tools
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Build deterministic project-test plan
        run: make project-test-manifest
      - name: Upload project-test plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-test-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/project-test-manifest.json
            target/quality/project-test-shard-plan.json
          if-no-files-found: error
          retention-days: 14

  project-test-core:
    needs: project-test-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install development quality tools
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Download project-test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality
      - name: Run core project-test shard
        run: make project-test-shard SHARD=core
      - name: Upload core shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-test-shard-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/core
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  project-test-governance:
    needs: project-test-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install development quality tools
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Download project-test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality
      - name: Run governance project-test shard
        run: make project-test-shard SHARD=governance
      - name: Upload governance shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-test-shard-governance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/governance
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  project-test-installer:
    needs: project-test-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install development quality tools
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Download project-test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality
      - name: Run installer project-test shard
        run: make project-test-shard SHARD=installer
      - name: Upload installer shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-test-shard-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/installer
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  project-test-lifecycle:
    needs: project-test-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install development quality tools
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Download project-test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality
      - name: Run lifecycle project-test shard
        run: make project-test-shard SHARD=lifecycle
      - name: Upload lifecycle shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-test-shard-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/lifecycle
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  project-test-release:
    needs: project-test-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install development quality tools
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Download project-test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality
      - name: Run release project-test shard
        run: make project-test-shard SHARD=release
      - name: Upload release shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-test-shard-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/release
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  template-smoke:
    needs: [project-test-core, project-test-governance, project-test-installer, project-test-lifecycle, project-test-release, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    # This job now owns the former aggregate and template quality stages, so
    # retain the template stage's overall bound while keeping its inner quality
    # command independently bounded below.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install development quality tools
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Download project-test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality
      - name: Download core shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/core
      - name: Download governance shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-governance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/governance
      - name: Download installer shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/installer
      - name: Download lifecycle shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/lifecycle
      - name: Download release shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/shards/release
      - name: Aggregate project-test evidence
        run: make project-test-aggregate
      - name: Upload aggregate project-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-test-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/project-test-aggregate
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Select governance diff baseline
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD)"
          fi
          printf 'AI_BASE_COMMIT=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Reject raw Dependabot delivery candidates
        if: github.event_name == 'pull_request'
        env:
          AI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AI_PR_URL: ${{ github.event.pull_request.html_url }}
          AI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          make check-dependabot-intake GITHUB_EVENT_NAME="${{ github.event_name }}" AI_PR_AUTHOR="$AI_PR_AUTHOR" AI_PR_URL="$AI_PR_URL" AI_PR_HEAD_SHA="$AI_PR_HEAD_SHA"

      - name: Determine release preparation scope
        env:
          AI_BASE_COMMIT: ${{ env.AI_BASE_COMMIT }}
          RELEASE_PREPARATION_INTENT: ${{ (github.event_name == 'workflow_dispatch' && inputs.purpose == 'release_preparation') || contains(github.event.pull_request.labels.*.name, 'release-preparation') }}
        run: |
          # Keep event boundaries visible for workflow compatibility and review.
          # github.event_name == 'pull_request'
          # github.event_name == 'workflow_dispatch'
          # github.ref == 'refs/heads/main'
          release_files="$(git diff --name-only "${AI_BASE_COMMIT}...HEAD")"
          if [[ "$RELEASE_PREPARATION_INTENT" == "true" ]] && printf '%s\n' "$release_files" | grep -Eq '^(release\.json|next-release\.json|release-state\.json|install\.sh|\.ai/cockpit/(sbom|provenance|release-digests)\.json)$'; then
            echo 'AI_RELEASE_PREPARATION=1' >> "$GITHUB_ENV"
          else
            echo 'AI_RELEASE_PREPARATION=0' >> "$GITHUB_ENV"
          fi

      - name: Verify documented public release contract
        run: |
          if [[ "$AI_RELEASE_PREPARATION" == "1" ]]; then
            make check-release-distribution
          else
            echo "No release files changed; release contract validation is not applicable."
          fi

      - name: Run repository quality gates
        timeout-minutes: 25
        shell: bash
        run: |
          set -uo pipefail
          echo '🟡 quality-full running'
          echo 'Current gate: initializing'
          echo 'Elapsed: 00:00'
          echo 'Completed: 0/unknown gates'
          echo 'Last progress: 0s ago'
          echo 'Evidence: target/quality/sessions/<pending>/'
          echo 'Starting bounded repository quality gates (25 minute execution limit, then 30 second forced-termination grace).'
          quality_started_epoch="$(date +%s)"
          timeout --foreground --kill-after=30s 25m make quality PROJECT_TEST_GATE=project-test-receipt > >(tee "$RUNNER_TEMP/repository-quality.log") 2>&1 &
          quality_pid=$!
          (
            started_epoch="$(date +%s)"
            while kill -0 "$quality_pid" 2>/dev/null; do
              now_epoch="$(date +%s)"
              elapsed=$((now_epoch - started_epoch))
              session_id=''
              current_gate='initializing'
              completed=0
              total='unknown'
              last_progress='0'
              if [[ -f target/quality/current-session.txt ]]; then
                session_id="$(cat target/quality/current-session.txt)"
                session_root="target/quality/sessions/$session_id"
                if compgen -G "$session_root/timing/*.json" > /dev/null; then
                  read -r current_gate completed total last_progress < <(python3 -c 'import json,sys; from pathlib import Path; records=[json.loads(path.read_text(encoding="utf-8")) for path in Path(sys.argv[1]).glob("*.json")]; latest=max(records,key=lambda item:item.get("startedAt","")); print(latest.get("gate","initializing"),sum(item.get("result")=="passed" for item in records),len(records),0)' "$session_root/timing")
                fi
              fi
              echo '🟡 quality-full running'
              echo "Current gate: $current_gate"
              printf 'Elapsed: %02d:%02d\n' $((elapsed / 60)) $((elapsed % 60))
              echo "Completed: $completed/$total gates"
              echo "Last progress: ${last_progress}s ago"
              echo "Evidence: target/quality/sessions/${session_id:-<pending>}/"
              echo "::notice title=quality heartbeat::repository quality gates still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              sleep 30
            done
          ) &
          heartbeat_pid=$!
          wait "$quality_pid"
          quality_status=$?
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          if [[ "$quality_status" -eq 0 ]]; then
            completed_elapsed=$(( $(date +%s) - quality_started_epoch ))
            coverage='unknown'
            if [[ -f target/coverage.json ]]; then
              coverage="$(python3 -c 'import json; print(json.load(open("target/coverage.json", encoding="utf-8"))["totals"]["percent_covered"])')"
            fi
            session_id='unknown'
            if [[ -f target/quality/current-session.txt ]]; then
              session_id="$(cat target/quality/current-session.txt)"
            fi
            echo '🟢 quality-full completed'
            printf 'Wall time: %02d:%02d\n' $((completed_elapsed / 60)) $((completed_elapsed % 60))
            echo "Coverage: $coverage"
            echo "Outcome: target/quality/sessions/$session_id/summary.json"
          fi
          if [[ "$quality_status" -eq 124 || "$quality_status" -eq 137 ]]; then
            echo 'Repository quality gates exceeded the 25 minute bound.' >&2
          fi
          exit "$quality_status"

      - name: Publish failed quality gate logs
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          found_failed_gate=0
          session_root=''
          if [[ -f target/quality/current-session.txt ]]; then
            session_root="target/quality/sessions/$(cat target/quality/current-session.txt)"
          fi
          for timing_path in "$session_root"/timing/*.json; do
            [[ -f "$timing_path" ]] || continue
            gate_result="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("result", "unknown"))' "$timing_path")"
            [[ "$gate_result" == "passed" ]] && continue
            found_failed_gate=1
            gate_name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("gate", "unknown"))' "$timing_path")"
            log_path="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("logPath", ""))' "$timing_path")"
            echo "::group::failure log: ${gate_name} (${gate_result})"
            if [[ -n "$log_path" && -f "$log_path" ]]; then
              tail -n 2000 "$log_path"
            else
              echo "Detailed gate log is missing: ${log_path:-$session_root/logs/${gate_name}.log}" >&2
              cat "$timing_path"
            fi
            echo "::endgroup::"
          done
          if [[ "$found_failed_gate" -eq 0 ]]; then
            echo "::group::failure log: repository quality wrapper"
            tail -n 2000 "$RUNNER_TEMP/repository-quality.log" || true
            echo "::endgroup::"
          fi

      - name: Verify clean-checkout Cockpit status consistency
        run: make check-ai-status-consistency

      - name: Publish quality timing summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f target/quality/current-session.txt ]]; then
            session_id="$(cat target/quality/current-session.txt)"
            session_root="target/quality/sessions/$session_id"
            if compgen -G "$session_root/timing/*.json" > /dev/null; then
              python3 scripts/summarize_quality_gates.py \
                --input "$session_root/timing" \
                --json-output "$session_root/summary.json" \
                --markdown-output "$session_root/summary.md"
              python3 scripts/ai_performance_budget.py \
                --input "$session_root/summary.json" \
                --output "$session_root/performance-baseline.json"
              cat "$session_root/summary.md" >> "$GITHUB_STEP_SUMMARY"
              cat "$session_root/performance-baseline.json" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No quality timing evidence was produced for session $session_id." >&2
              exit 1
            fi
          else
            echo 'Quality session identity was not produced.' >&2
            exit 1
          fi

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/current-session.txt
            target/quality/sessions/**
            target/coverage.json
            ${{ runner.temp }}/repository-quality.log
          if-no-files-found: error
          retention-days: 14

      - name: Run template AI checks
        run: |
          # Provider-bound recovery receipts are validated offline after their
          # creation-time GitHub evidence check; this PR audit needs no API token.
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            # quality owns format/governance checks; this step owns only the
            # PR diff/Contract binding after the quality graph has completed.
            make check-ai-pr-core AI_BASE_COMMIT="$AI_BASE_COMMIT"
          else
            make check-ai-backtrack
            make check-ai-coverage-guard
            make check-ai-diff-ownership
          fi

  installation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Installer dry run
        run: |
          tmp="$(mktemp -d)"
          git init -b main "$tmp"
          (
            cd "$tmp"
            printf 'include Makefile.ai\n' > Makefile
            for stack in rust go java kotlin swift ruby php csharp; do
              "$GITHUB_WORKSPACE/install.sh" --stack "$stack" --dry-run
            done
          )

      - name: Install into temporary repository
        run: |
          tmp="$(mktemp -d)"
          git init -b main "$tmp"
          (
            cd "$tmp"
            unset AI_BASE_COMMIT
            git config user.email test@example.invalid
            git config user.name 'CI Smoke'
            printf 'include Makefile.ai\n' > Makefile
            git add Makefile
            git commit -m 'initial host project'
            base="$(git rev-parse HEAD)"
            "$GITHUB_WORKSPACE/install.sh" --stack generic --with-examples --create-adoption
            test -f scripts/ai_check_pr.py
            grep -q '^check-ai-pr:' Makefile.ai
            for stack in csharp go java kotlin php python ruby swift; do
              test -f "examples/$stack/README.md"
            done
            python3 -m py_compile scripts/*.py
            find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
            if make ai-cockpit-quality; then
              echo 'generic quality must fail until project checks are configured' >&2
              exit 1
            fi
            make ai-finish TASK=adopt_ai_cockpit
            if test -f .ai/work-items/active/adopt_ai_cockpit.contract.json; then
              make archive-work-item CONTRACT=.ai/work-items/active/adopt_ai_cockpit.contract.json
            fi
            test -f .ai/work-items/archive/2026/adopt_ai_cockpit.contract.json
            git add .
            git commit -m 'install template'
            make check-ai-status-consistency
            make check-ai-backtrack
            make check-ai-coverage-guard
            make check-ai-diff-ownership
            make check-ai-pr AI_BASE_COMMIT="$base"
          )

      - name: Reinstall is idempotent
        run: |
          tmp="$(mktemp -d)"
          git init -b main "$tmp"
          (
            cd "$tmp"
            printf '# Existing\n' > AGENTS.md
            printf '# Gemini\n' > GEMINI.md
            printf 'all:\n\t@true\n' > Makefile
            "$GITHUB_WORKSPACE/install.sh" --stack typescript --update-makefile
            "$GITHUB_WORKSPACE/install.sh" --stack typescript --dry-run --update-makefile
          )

  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release evidence ownership
        env:
          RELEASE_PREPARATION_INTENT: ${{ (github.event_name == 'workflow_dispatch' && inputs.purpose == 'release_preparation') || contains(github.event.pull_request.labels.*.name, 'release-preparation') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PREPARATION_INTENT" == "true" ]]; then
            make check-release-state-consistency
            if git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}...${{ github.sha }}" | grep -Eq '^(release\.json|next-release\.json|release-state\.json|install\.sh|\.ai/cockpit/(sbom|provenance|release-digests)\.json)$'; then
              make check-release-distribution
            else
              echo 'Explicit release-preparation intent has no controlled release-file changes; release distribution evidence is not applicable.'
            fi
          else
            echo 'No explicit release-preparation intent; release contract validation is not applicable.'
          fi

  ci-evidence:
    needs: [template-smoke, installation-smoke, release-evidence]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download hosted project-test plan
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'hosted_measurement'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-measurement/plan

      - name: Download hosted core shard evidence
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'hosted_measurement'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-measurement/shards/core

      - name: Download hosted governance shard evidence
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'hosted_measurement'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-governance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-measurement/shards/governance

      - name: Download hosted installer shard evidence
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'hosted_measurement'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-measurement/shards/installer

      - name: Download hosted lifecycle shard evidence
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'hosted_measurement'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-measurement/shards/lifecycle

      - name: Download hosted release shard evidence
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'hosted_measurement'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-shard-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-measurement/shards/release

      - name: Download hosted aggregate project-test evidence
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'hosted_measurement'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: project-test-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-measurement/aggregate

      - name: Generate and validate aggregate CI evidence
        shell: bash
        env:
          TEMPLATE_RESULT: ${{ needs.template-smoke.result }}
          INSTALLATION_RESULT: ${{ needs.installation-smoke.result }}
          RELEASE_RESULT: ${{ needs.release-evidence.result }}
        run: |
          set -euo pipefail
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          merge_sha="${{ github.sha }}"
          results=("template-smoke:$TEMPLATE_RESULT" "installation-smoke:$INSTALLATION_RESULT" "release-evidence:$RELEASE_RESULT")
          overall_conclusion=success
          evidence_state=candidate
          failure_args=()
          for result in "${results[@]}"; do
            status="${result#*:}"
            if [[ "$status" != "success" ]]; then
              overall_conclusion=failure
              evidence_state=failed
              failure_args+=("$result")
            fi
          done
          failure_json='[]'
          if ((${#failure_args[@]} > 0)); then
            failure_json="$(printf '%s\n' "${failure_args[@]}" | jq -R . | jq -s .)"
          fi
          jq -n \
            --arg state "$evidence_state" \
            --arg conclusion "$overall_conclusion" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg head_sha "$head_sha" \
            --arg merge_sha "$merge_sha" \
            --arg relation "${{ github.event_name == 'pull_request' && 'pull_request_merge_ref' || 'direct_commit' }}" \
            --argjson failure_reasons "$failure_json" \
            --arg template "$TEMPLATE_RESULT" \
            --arg installation "$INSTALLATION_RESULT" \
            --arg release "$RELEASE_RESULT" \
            '{
              format: "ai-cockpit-ci-release-evidence",
              schemaVersion: 1,
              state: $state,
              evidenceSource: "github_actions",
              workflowRunId: $run_id,
              headSha: $head_sha,
              mergeCommitSha: $merge_sha,
              headToMergeRelationship: $relation,
              requiredJobNames: ["template-smoke", "installation-smoke", "release-evidence"],
              workflowRuns: [{workflowRunId: $run_id, workflowName: "smoke.yml", headSha: $head_sha, requiredJobNames: ["template-smoke", "installation-smoke", "release-evidence"], jobs: [{name: "template-smoke", conclusion: $template}, {name: "installation-smoke", conclusion: $installation}, {name: "release-evidence", conclusion: $release}], conclusion: $conclusion, failureReasons: $failure_reasons}],
              conclusion: $conclusion,
              failureReasons: $failure_reasons,
              artifactDigests: {"sbom.json": null, "provenance.json": null},
              sbom: {digest: null, sourceCommit: $head_sha},
              provenance: {digest: null, sourceCommit: $head_sha}
            }' > "$RUNNER_TEMP/ci-release-evidence.json"
          validation_status=0
          make check-ci-release-evidence \
            CI_RELEASE_EVIDENCE="$RUNNER_TEMP/ci-release-evidence.json" \
            CI_EXPECTED_HEAD_SHA="$head_sha" || validation_status=$?
          cat "$RUNNER_TEMP/ci-release-evidence.json"
          if [[ "$validation_status" -ne 0 ]]; then
            exit "$validation_status"
          fi
          if [[ "$overall_conclusion" != "success" ]]; then
            echo 'One or more required CI jobs did not succeed.' >&2
            exit 1
          fi

      - name: Write hosted measurement receipt
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'hosted_measurement'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/hosted-measurement-receipt.json"
          provider_run="$RUNNER_TEMP/hosted-measurement-provider-run.json"
          provider_jobs="$RUNNER_TEMP/hosted-measurement-provider-jobs.json"
          fetch_provider_metadata() {
            local url="$1"
            local output="$2"
            if curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$url" > "$output"; then
              return 0
            fi
            if [[ "${{ github.event.repository.private }}" == "false" ]]; then
              echo 'Authenticated Hosted metadata lookup was denied; retrying the public read-only endpoint.' >&2
              curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                "$url" > "$output"
              return 0
            fi
            echo 'Hosted metadata API access blocked for a private repository; grant actions:read to GITHUB_TOKEN and rerun.' >&2
            return 1
          }
          fetch_provider_metadata \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID" \
            "$provider_run"
          fetch_provider_metadata \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            "$provider_jobs"
          python3 scripts/quality_measurements.py build-receipt \
            --aggregate-root "$RUNNER_TEMP/hosted-measurement/aggregate" \
            --shards-root "$RUNNER_TEMP/hosted-measurement/shards" \
            --manifest "$RUNNER_TEMP/hosted-measurement/plan/project-test-manifest.json" \
            --provider-run "$provider_run" \
            --provider-jobs "$provider_jobs" \
            --repository "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --output "$receipt"

      - name: Upload hosted measurement receipt
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'hosted_measurement'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-measurement-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-measurement-receipt.json
          if-no-files-found: error
          retention-days: 14
